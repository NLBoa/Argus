# gitleaks config: default rules plus Argus-specific ones.
[extend]
useDefault = true

[[rules]]
id = "canvas-ical-feed"
description = "Canvas calendar feed URL (the URL itself is a credential)"
regex = '''instructure\.com/feeds/calendars/user_[A-Za-z0-9]{20,}'''

[[rules]]
id = "runna-ical-feed"
description = "Runna calendar feed URL (the URL itself is a credential, D078)"
regex = '''cal\.runna\.com/[A-Za-z0-9_-]{20,}(\.ics)?'''

[[rules]]
id = "flowsavvy-api-key"
description = "FlowSavvy API key next to its name (43 URL-safe characters, no prefix; full calendar access, D079)"
regex = '''(?i)flowsavvy[a-z_]*["']?\s*[:=]\s*(?:SecretStr\()?["']?[A-Za-z0-9_-]{40,}'''
keywords = ["flowsavvy"]

[[rules]]
id = "twilio-auth-token-assignment"
description = "Twilio auth token in an env-style assignment"
regex = '''ARGUS_TWILIO_AUTH_TOKEN=[0-9a-f]{32}'''

[[rules]]
id = "mcp-path-secret"
description = "Claude connector URL with its path secret (the path is the credential)"
regex = '''/mcp/[A-Za-z0-9_-]{32,}'''

[[rules]]
id = "tailnet-hostname"
description = "A real Tailscale MagicDNS name (the repo is public; use argus.<tailnet>.ts.net)"
regex = '''[a-z0-9-]+\.tail[0-9a-f]{4,}\.ts\.net'''
