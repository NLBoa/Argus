{% from "components/ui.html" import icon %}
{#- The day rail: the hero of Today and the kiosk. Classes are solid, sessions dashed,
    commitments hatched; the bronze needle is now. A list version is given for screen readers. -#}
{% macro day_rail(tl, label="Your day") -%}
<figure class="m-0">
  <figcaption class="visually-hidden">{{ label }}: {{ tl.blocks|length }} scheduled block{{ "" if tl.blocks|length == 1 else "s" }}.</figcaption>
  <div class="day-rail" style="--hours: {{ tl.span_hours }}" aria-hidden="true">
    <div class="day-rail__hours">
      {% for text, top in tl.hours %}<span class="day-rail__hour" style="top: {{ top }}%">{{ text }}</span>{% endfor %}
    </div>
    <div class="day-rail__track">
      {% for b in tl.blocks %}
      <div class="rail-block rail-block--{{ b.kind }}" {% if b.accent %}data-accent="{{ b.accent }}"{% endif %} style="top: {{ b.top_pct }}%; height: {{ b.height_pct }}%">
        <span class="rail-block__title">{{ b.title }}</span>
        <span class="rail-block__sub tnum">{{ b.start_text }} to {{ b.end_text }}{% if b.subtitle %}, {{ b.subtitle }}{% endif %}</span>
      </div>
      {% endfor %}
      {% for m in tl.due_marks %}
      <span class="rail-due" style="top: {{ m.top_pct }}%">{{ icon("alarm-clock", "icon-sm") }}{{ m.text }}</span>
      {% endfor %}
      {% if tl.now_pct is not none %}
      <div class="rail-now" style="top: {{ tl.now_pct }}%"><span class="rail-now__label">Now {{ tl.now_text }}</span></div>
      {% endif %}
    </div>
  </div>
  <ul class="visually-hidden">
    {% for b in tl.blocks %}<li>{{ b.label }}</li>{% endfor %}
    {% for m in tl.due_marks %}<li>{{ m.item_title }} due at {{ m.text }}</li>{% endfor %}
  </ul>
</figure>
{%- endmacro %}
