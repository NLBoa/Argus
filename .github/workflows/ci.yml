name: ci
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64          # the Pi is arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Same image the Linux visual baselines are recorded in (scripts/visual_linux.sh).
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --ipc=host
    env:
      UV_LINK_MODE: copy
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: System packages
        run: apt-get update -qq && apt-get install -y -qq git make curl >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install uv and gitleaks
        run: |
          pip install -q uv==0.13.1
          case "${{ matrix.arch }}" in x64) GA=x64 ;; arm64) GA=arm64 ;; esac
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GA}.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Sync dependencies
        run: uv sync --frozen
      # Visual is out of CI until the overhaul ends: baselines are darwin-only until then, and the
      # Linux set is re-recorded once (scripts/visual_linux.sh --update). Then switch back to `make check`.
      - name: make check-ci
        run: make check-ci
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ matrix.arch }}
          path: tests/visual/__diff__/
          if-no-files-found: ignore
