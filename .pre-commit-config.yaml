# Hooks run the project's own pinned tools (via uv) so local, pre-commit, and CI agree.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=800]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: (\.png$|^argus/web/static/(vendor|fonts|icons)/)
      - id: trailing-whitespace
        exclude: (\.png$|^argus/web/static/(vendor|fonts|icons)/)
      - id: detect-private-key
