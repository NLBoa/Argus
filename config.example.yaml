# Argus configuration. Copy to config.yaml and edit. Contains NO secrets:
# credentials go in environment variables (see .env.example) or systemd credentials.

# umd.io semester code: YYYY + 01 (spring), 05 (summer), 08 (fall), 12 (winter).
term: "202608"

courses:
  # code: UMD course code; section: 4-digit section (umd.io looks up meetings by these).
  # canvas_id: numeric id from the ELMS course URL (umd.instructure.com/courses/<id>).
  # gradescope_id: id from the Gradescope course URL (gradescope.com/courses/<id>).
  # piazza_network_id: id from the Piazza URL (piazza.com/class/<id>); omit if unused.
  - code: CMSC351
    section: "0101"
    canvas_id: 1234567
    gradescope_id: "765432"
    piazza_network_id: "abc123xyz"
    accent: indigo
    difficulty_note: "Proof-heavy problem sets; budget extra time for writing up."
  - code: MATH240
    section: "0201"
    canvas_id: 1234568

schedule:
  # All times are local (America/New_York). Windows ending before they start wrap midnight.
  waking_window: { start: "08:00", end: "23:00" }
  quiet_hours: { start: "23:00", end: "08:00" }
  walking_buffer_minutes: 15
  morning_brief: "08:00"    # inside quiet hours it would wait until they end
  # When you usually work. Argus plans into these hours only, and texts you before each one.
  # These seed the first run; after that, change them in Settings (or edit them here and run
  # `sudo argus-admin windows --reset` on the Pi). `days` are start days; an end
  # before the start runs past midnight. At most 3 windows a day.
  work_windows:
    - { days: [Mon, Tue, Wed, Thu], start: "19:00", end: "23:00" }
    - { days: [Sun], start: "13:00", end: "18:00" }
  commitments:
    - { title: "Dining hall shift", days: [Tue, Thu], start: "17:00", end: "20:00" }

notifications:
  daily_text_cap: 6          # at-risk, work-window, and 3-hour messages are not counted
  window_notice_minutes: 20  # the work-window message goes out this long before each window
  ntfy_server: "https://ntfy.sh"
  dashboard_url: "https://argus-pi.example-tailnet.ts.net"  # opened when you tap a push
  # Exactly the URL Twilio posts replies to (Funnel port 8443 or your Cloudflare hostname); see docs/runbook.md
  webhook_url: "https://argus-pi.example-tailnet.ts.net:8443/webhooks/twilio/sms"

ai:
  models:
    fast: claude-haiku-5-5     # extraction
    standard: claude-sonnet-5-5  # estimates, study-note generation
    strong: claude-opus-5-5    # verification
  monthly_budget_usd: 10.0

canvas:
  base_url: "https://umd.instructure.com"

paths:
  data_dir: var              # SQLite DB, caches
  vault_dir: var/vault       # git clone of the Obsidian vault
  backup_dir: var/backups
  # backup_remote: backup@nas:/srv/backups/argus   # rsync target for the nightly copy (over Tailscale)
  # vault_name: School       # the vault's name in Obsidian, for obsidian:// links
