[project]
name = "argus"
version = "0.1.0"
description = "Argus: a personal, always-on course hub for one UMD student, running on a Raspberry Pi."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.146",
  "uvicorn[standard]>=0.54",
  "jinja2>=3.1.6",
  "pydantic>=2.14",
  "pyyaml>=6.0.3",
  "httpx>=0.28.1",
  "typer>=0.27",
  "tzdata>=2026.1",
]

[project.scripts]
argus = "argus.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.17.1",
  "mypy>=2.4",
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "hypothesis>=6.170",
  "time-machine>=3.5",
  "respx>=0.23.1",
  "pytest-cov>=7.1",
  "playwright==1.63.0",  # must match the mcr.microsoft.com/playwright/python image tag
  "pytest-playwright>=0.10",
  "axe-playwright-python>=0.1.8",
  "pillow>=13.0",
  "pre-commit>=4.7",
  "types-PyYAML>=6.0",
  "httpx2>=2.14.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "DTZ", "TID", "PT", "PL", "C4", "RET", "ARG",
]
ignore = [
  "PLR0913",  # many-argument functions are fine for pure domain functions
  "PLR2004",  # magic values are clearer than constants in tests and rules
  "S101",     # assert is used in tests
  "PLC0415",  # lazy imports keep CLI startup fast on the Pi
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Use argus.clock.Clock.now(); only clock.py may read the wall clock."
"datetime.datetime.utcnow".msg = "Use argus.clock.Clock.now()."
"datetime.datetime.today".msg = "Use argus.clock.Clock.now()."
"datetime.date.today".msg = "Use argus.clock.Clock.today_local()."
"time.time".msg = "Use argus.clock.Clock.now() (or time.monotonic for durations)."

[tool.ruff.lint.per-file-ignores]
"argus/clock.py" = ["TID251"]
"tests/**" = ["S", "PLR", "ARG", "TID251"]
"scripts/**" = ["S", "TID251"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["argus"]
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "a11y: accessibility checks with axe-core",
  "visual: screenshot regression tests",
  "e2e: browser end-to-end tests",
  "evals: AI evals against the real API (make evals only)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["argus"]
omit = ["argus/__main__.py"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "\\.\\.\\.$",
]
